openapi: 3.0.0
info:
  title: Main API
  version: "1.0"
  description: API "ООО Ромашка" — отчёты по доменным сущностям

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /:
    post:
      summary: Health check
      operationId: main.main
      responses:
        '200':
          description: Приветствие
          content:
            application/json:
              schema:
                type: string
              example: "Hello, world"

  /api/get_report:
    get:
      summary: TXT-отчёт по первому рецепту из хранилища
      description: Возвращает текстовый отчёт для первого рецепта в storage_manager
      operationId: main.get_report
      responses:
        '200':
          description: TXT-отчёт
          content:
            text/plain:
              schema:
                type: string
              example: |
                Код | Наименование | Брутто | Нетто
                aafc... | Мука ржаная | 62.5 | 61.25

  /api/report/default/{entity_type}/{code}:
    get:
      summary: Отчёт в формате из настроек (create_default)
      description: |
        Формат берётся из settings_model.response_format.
        - TXT / XML / HTML → структурированный текст
        - CSV / Markdown → скачивание файла (Content-Disposition attachment)
      operationId: main.get_report_default
      parameters:
        - name: entity_type
          in: path
          required: true
          description: Тип сущности
          schema:
            type: string
            enum: [nomenclature, range, recipe]
        - name: code
          in: path
          required: true
          description: Уникальный код (id) сущности
          schema:
            type: string
      responses:
        '200':
          description: Отчёт сформирован
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
        '400':
          description: Неверный тип сущности
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
              example:
                detail: "Неизвестный тип сущности: foo"
        '404':
          description: Сущность с таким кодом не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
              example:
                detail: "Сущность recipe с кодом aafc9421 не найдена"

  /api/report/{format}/{entity_type}/{code}:
    get:
      summary: Отчёт в явно указанном формате
      description: |
        - TXT / XML / HTML → структурированный текст (media_type соответствующий)
        - CSV / Markdown → скачивание файла (Content-Disposition attachment)
      operationId: main.get_report_in_format
      parameters:
        - name: format
          in: path
          required: true
          description: Формат отчёта
          schema:
            type: string
            enum: [TXT, CSV, Markdown, XML, HTML]
        - name: entity_type
          in: path
          required: true
          description: Тип сущности
          schema:
            type: string
            enum: [nomenclature, range, recipe]
        - name: code
          in: path
          required: true
          description: Уникальный код (id) сущности
          schema:
            type: string
      responses:
        '200':
          description: Отчёт сформирован
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
        '400':
          description: Неверный формат или тип сущности
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
              example:
                detail: "Неизвестный формат отчета: PDF"
        '404':
          description: Сущность с таким кодом не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }

  /api/entities:
    get:
      summary: Список кодов всех сущностей
      description: |
        Возвращает `id` и `name` всех сущностей из storage_manager
        (номенклатура, единицы измерения, рецепты).
      operationId: main.list_entities
      responses:
        '200':
          description: Объект с тремя списками сущностей
          content:
            application/json:
              schema:
                type: object
                properties:
                  nomenclature:
                    type: array
                    items:
                      type: object
                      properties:
                        id:   { type: string }
                        name: { type: string }
                  range:
                    type: array
                    items:
                      type: object
                      properties:
                        id:   { type: string }
                        name: { type: string }
                  recipe:
                    type: array
                    items:
                      type: object
                      properties:
                        id:   { type: string }
                        name: { type: string }
              example:
                nomenclature:
                  - id: "aafc9421a20944e98342c02bafaaa8a0"
                    name: "Кефир 1%"
                range:
                  - id: "8587666ec0d84b3181ee321fe10d0dc3"
                    name: "килограмм"
                recipe:
                  - id: "3f9d1a2b4c6e8f0a9b1c2d3e4f5a6b7c"
                    name: "Оладьи пышные на кефире (1 порция)"
